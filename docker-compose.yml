version: "3.9"

services:
  mariadb:
    image: mariadb:11.4
    container_name: 911-analysis-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build: .
    container_name: 911-analysis-api
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # Forward MariaDB credentials into the container
      MARIADB_HOST: mariadb
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
    ports:
      - "8000:8000"
    # Use the same network (default) as mariadb; no extra config needed

volumes:
  mariadb_data:
